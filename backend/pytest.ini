[pytest]
testpaths = tests
addopts = -ra
filterwarnings =
    # starlette's TestClient still names an anyio alias that anyio has deprecated.
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    # mongomock's own TTL emulation calls datetime.utcnow().
    ignore:datetime.datetime.utcnow:DeprecationWarning:mongomock
